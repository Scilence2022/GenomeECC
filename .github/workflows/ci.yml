name: GenomeECC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - name: Build and smoke-test the installed wheel
        shell: bash
        run: |
          test -f LICENSE
          python -m build
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          python -m zipfile -l "$wheel" | grep -E '[.]dist-info/(licenses/)?LICENSE'
          work=$(mktemp -d)
          python -m venv "$work/env"
          source "$work/env/bin/activate"
          python -m pip install "$wheel"
          cd "$work"
          printf '>test\nACGT\n' > reference.fna
          genome-ecc encode -g reference.fna -o test.ecc
          genome-ecc info -e test.ecc
          genome-ecc verify -e test.ecc -g reference.fna --exact
          printf 'test\t0\tACGT\n' > blocks.tsv
          genome-ecc recover -e test.ecc --blocks blocks.tsv -o recovered.fna
          cmp reference.fna recovered.fna

  assembly:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: genomeecc-assembly
          channels: conda-forge,bioconda
          channel-priority: strict
          python-version: '3.11'
      - run: conda install --yes khmer=3.0.0a3
      - run: python -m pip install -e '.[dev]'
      - run: python -c 'import khmer; print(khmer.__version__)'
      - run: python -m pytest tests/test_assembly.py

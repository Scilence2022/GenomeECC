[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeecc"
version = "0.3.0"
description = "Error-correcting codes for whole-genome DNA data preservation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Lifu Song" }]
keywords = ["DNA", "genome", "error-correcting-codes", "reed-solomon", "fountain-codes", "DNA-storage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.21",
    "reedsolo>=1.7,<2",
    "crc8>=0.2.1",
]

[project.optional-dependencies]
# Install the optional assembly backend from Bioconda as documented in README.
# DES helpers, kept only to read data encoded by older versions. See README.
legacy-crypto = ["pyDes>=2.0.1"]
dev = ["pytest>=7.0"]

[project.scripts]
genome-ecc = "genome_ecc_cli:main"

[tool.setuptools]
py-modules = [
    "utils", "test_utils", "chromosomeECC", "genomeECC", "chromosomeChunk",
    "deBruijnGraph", "DNAdroplet", "DNAfountain", "droplet", "fountain",
    "glass", "crc16pure", "genome_ecc_cli", "ecc_format", "ecc_archive",
    "fasta", "fountain_codec",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_utils.py is a helper library, not a test module, despite its name. Without this
# pytest collects it and errors while trying to run its helpers as tests.
python_files = ["test_*.py"]
norecursedirs = ["genomes", ".git", ".claude"]
addopts = "-q"
